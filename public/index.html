<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Parcial 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="tarjeta acceso">
      <h2>Iniciar sesión</h2>
      <form id="form-login" novalidate>
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" data-testid="login-email" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" data-testid="login-password" required>
        <button type="submit" class="ancho" data-testid="login-submit">Ingresar</button>
      </form>
      <div id="mensaje" class="mensaje" role="alert" data-testid="login-mensaje"></div>
      <p class="pie">¿No tienes cuenta? <a href="register.html" data-testid="link-registro">Regístrate</a></p>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    if (Sesion.token()) location.href = 'users.html';
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('mensaje');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return mostrar(msg, 'Escribe tu correo y tu contraseña', 'error');
      try {
        const r = await api('/api/auth/login', { method: 'POST', body: { email, password } });
        Sesion.guardar(r.token, r.user);
        location.href = 'users.html';
      } catch (err) { mostrar(msg, err.message, 'error'); }
    });
  </script>
</body>
</html>
