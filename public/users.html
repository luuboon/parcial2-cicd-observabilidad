<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios · Parcial 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <h1>Gestión de usuarios</h1>
    <div><span id="quien" data-testid="usuario-actual"></span> <button id="salir" data-testid="logout">Cerrar sesión</button></div>
  </header>
  <main>
    <section class="tarjeta">
      <h2 id="titulo-form" data-testid="form-titulo">Nuevo usuario</h2>
      <form id="form-usuario" novalidate>
        <input type="hidden" id="id">
        <div class="fila">
          <div><label for="name">Nombre</label><input id="name" data-testid="usuario-nombre"></div>
          <div><label for="email">Correo</label><input id="email" type="email" data-testid="usuario-email"></div>
          <div><label for="password">Contraseña</label><input id="password" type="password" data-testid="usuario-password" placeholder="Mínimo 8 caracteres"></div>
          <div><label for="role">Rol</label><select id="role" data-testid="usuario-rol"><option value="user">user</option><option value="admin">admin</option></select></div>
        </div>
        <p>
          <button type="submit" data-testid="usuario-guardar">Guardar</button>
          <button type="button" class="secundario" id="cancelar" data-testid="usuario-cancelar">Cancelar</button>
        </p>
      </form>
      <div id="mensaje" class="mensaje" role="alert" data-testid="usuarios-mensaje"></div>
    </section>
    <section class="tarjeta" style="margin-top:20px">
      <div class="encabezado"><h2>Usuarios registrados</h2><span id="usuarios-total" data-testid="usuarios-total"></span></div>
      <table data-testid="tabla-usuarios">
        <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    if (!Sesion.token()) location.href = 'index.html';
    const $ = (id) => document.getElementById(id);
    const msg = $('mensaje');
    $('quien').textContent = (Sesion.usuario() || {}).email || '';
    $('salir').onclick = () => { Sesion.cerrar(); location.href = 'index.html'; };

    function limpiar() {
      $('form-usuario').reset(); $('id').value = '';
      $('titulo-form').textContent = 'Nuevo usuario';
    }
    $('cancelar').onclick = () => { limpiar(); msg.className = 'mensaje'; };

    async function cargar() {
      try {
        const lista = await api('/api/users');
        $('usuarios-total').textContent = `${lista.length} usuario(s)`;
        $('filas').innerHTML = '';
        for (const u of lista) {
          const tr = document.createElement('tr');
          tr.dataset.testid = `fila-${u.email}`;
          tr.setAttribute('data-testid', `fila-${u.email}`);
          for (const v of [u.id, u.name, u.email, u.role]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); }
          const acc = document.createElement('td'); acc.className = 'acciones';
          const ed = document.createElement('button'); ed.textContent = 'Editar'; ed.className = 'secundario'; ed.setAttribute('data-testid', 'editar');
          ed.onclick = () => { $('id').value = u.id; $('name').value = u.name; $('email').value = u.email; $('role').value = u.role; $('password').value = ''; $('titulo-form').textContent = `Editar usuario #${u.id}`; };
          const del = document.createElement('button'); del.textContent = 'Eliminar'; del.className = 'peligro'; del.setAttribute('data-testid', 'eliminar');
          del.onclick = async () => {
            if (!confirm(`¿Eliminar a ${u.name}?`)) return;
            try { await api(`/api/users/${u.id}`, { method: 'DELETE' }); mostrar(msg, 'Usuario eliminado', 'ok'); cargar(); }
            catch (err) { mostrar(msg, err.message, 'error'); }
          };
          acc.append(ed, del); tr.appendChild(acc); $('filas').appendChild(tr);
        }
      } catch (err) {
        if (!Sesion.token()) location.href = 'index.html';
        mostrar(msg, err.message, 'error');
      }
    }

    $('form-usuario').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = $('id').value;
      const body = { name: $('name').value.trim(), email: $('email').value.trim(), role: $('role').value };
      if ($('password').value || !id) body.password = $('password').value;
      try {
        if (id) { await api(`/api/users/${id}`, { method: 'PUT', body }); mostrar(msg, 'Usuario actualizado', 'ok'); }
        else { await api('/api/users', { method: 'POST', body }); mostrar(msg, 'Usuario creado', 'ok'); }
        limpiar(); cargar();
      } catch (err) { mostrar(msg, err.message, 'error'); }
    });

    cargar();
  </script>
</body>
</html>
