# NGINX como proxy inverso: recibe en el puerto 80 (0.0.0.0) y reenvía a la app.
log_format json_combined escape=json '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"user_agent":"$http_user_agent"}';

server {
  listen 80 default_server;
  server_name _;
  access_log /dev/stdout json_combined;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /nginx-health { access_log off; return 200 "ok\n"; }
}
